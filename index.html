  <body>
    <header>
      <div class="brand"><b aria-hidden="true">▦</b> MatrixLab</div>
      <div class="languages">
        <button id="en">EN</button><button id="tr">TR</button>
      </div>
    </header>
    <main>
      <nav id="studyNav" class="bar study-nav" aria-label="MatrixLab"></nav>
      <section id="guided" class="study-panel" hidden></section><div id="practice" hidden></div>
      <div id="workspace">
        <div class="page-head">
          <h1 data-t="workspace"></h1>
          <details id="guide">
            <summary data-t="guide"></summary>
            <p data-t="guideText"></p>
          </details>
        </div>
        <div class="setup-grid">
          <div class="left-stack">
          <section class="operation-panel">
            <h2 data-t="operations"></h2>
            <div id="opSelect"></div>
            <div id="options"></div>
            <button id="run" class="primary"></button>
            <div aria-live="polite" id="result"></div>
          </section>
            <section class="current-panel">
              <h2 data-t="active"></h2>
              <div id="working"></div>
              <div id="historyBar" class="bar"></div>
              <details id="history">
                <summary data-t="steps"></summary>
                <div id="log"></div>
              </details>
            </section>
          </div>
          <div class="right-stack">
          <section class="editor-panel">
            <h2 data-t="input"></h2>
            <div id="dimensions" class="bar"></div>
            <div class="paper">
              <div class="matrix-label" id="atitle"></div>
              <div id="editor"></div>
            </div>
            <p data-t="tip"></p>
            <small data-t="originalEdit"></small>
          </section>
            <section>
              <h2 data-t="properties"></h2>
              <div id="properties"></div>
              <p data-t="diff"></p>
            </section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
